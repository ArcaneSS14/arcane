- proto: Paper
  entities:
  - uid: 2683
    components:
    - type: MetaData
      name: записка
    - type: Transform
      pos: 11.828029,-15.706404
      parent: 1
    - type: Paper
      content: >2-

           [color=#00008e][italic]Слушай, по твоей просьбе повозился  с этим новомодным устройством, которое нам прислали... Ну и фонит же оно, я тебе скажу! Явно больше, чем должно было до повреждения. Уж не знаю, кто там из них виноват, при доставке на планету облажались, или же еще на производстве черти эти брак нам пропустили, но заварить пробоину я так не смог, хрен его знает, что они там с материалами нахимичили. Еще и из инструкции ничерта не понял, чтоб их корпораты драли... Ну вот зачем эти умники туда колбу с цезием прицепили?!?! 

        Короче, работать оно будет, вроде в общих чертах починил, но настрадаться с этой хренью нам придется страшно... Скорей бы моя смена закончилась, я сюда ехал оружием бряцать, а не в железках возиться под треск от запредельной радиации...[/italic][/color]
  - uid: 2684
    components:
    - type: MetaData
      name: обрывок инструкции
    - type: Transform
      rot: -1.5707963267948966 rad
      pos: 14.192258,-19.434399
      parent: 1
    - type: Paper
      content: >2-




                      [italic]...не намеренно используется мощное гамма-излучение от распада изотопов для создания радиационного шума, влияющего на кубиты. Гамма-фотоны вызывают фазовые сдвиги и битовые ошибки, превращая вычисления в хаотичный процесс с непредсказуемым результатом, что позволяет проводить прорывные вычисления, недоступные человеческому разуму. 

        Постоянное разрушение квантовых состояний и чувствительность кубитов к высоким температурам делает РКВ крайне энергозатратным устройством, так что убедитесь, что у вас имеется мощная энергосеть под боком для поддержания температуры около 10 милликельвинов в контуре охлаждения и поддержания вычислений с системой хаотичного квантового перезапуска. Крайне не рекоменду...[/italic]
