- type: species
  id: Synth
  name: species-name-synth
  roundStart: true
  prototype: MobSynth
  sprites: MobSynthSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobSynthMarkingLimits
  dollPrototype: AppearanceSynth
  skinColoration: Hues
  # Arcane-Start
  sexes:
  - Unsexed
  - Male
  - Female
  category: Unusual
  description: "/ServerInfo/_Arcane/SpeciesDescriptions/Synth.xml"
  pros:
  - Не нуждаются в дыхании и не задыхаются в вакууме или дыму.
  - Могут есть сырьё — руду, листы и прутья.
  - Пассивно восстанавливают дробящий, ожоговый и клеточный урон за счёт нанонитов, пока хватает сытости.
  - Еда подзаряжает внутренний энергоэлемент, а удар током заряжает его в разы быстрее.
  special:
  - Потребляют заряд батареи, без которого не смогут продолжать существование.
  - Вместо крови у них фуллерен — углеродная жидкость. На кровотечения и ремонт он расходуется, а углерод в пище помогает его восполнить.
  - Нанниты лечат повреждения синтов, но в дозах свыше 10.5 единиц смертельно опасны — и для них, и для органических существ.
  - Мозг синта — вычислительный блок, который можно пересадить в корпус киборга.
  - Энергоэлемент можно заменить хирургически.
  cons:
  - Не может быть клонирован.
  - Реагенты нельзя ввести инъекцией — препараты действуют только при приёме внутрь.
  - ЭМП разряжает батарею и наносит урон током и жаром.
  - Автономный ремонт расходует сытость, поэтому при низком её уровне восстановление прекращается.
  # Arcane-End

