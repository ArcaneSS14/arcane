- type: job
  id: ChiefMedicalOfficer
  name: job-name-cmo
  description: job-description-cmo
  playTimeTracker: JobChiefMedicalOfficer
  requirements:
    - !type:RoleTimeRequirement
      role: JobChemist
      time: 2.5h
    - !type:RoleTimeRequirement
      role: JobMedicalDoctor
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 10h
      # Arcane-start
    # - !type:SpeciesRequirement # Goob - None Felinid
      # inverted: true
      # species:
      # - Felenid
      # Arcane-end
  weight: 10
  startingGear: CMOGear
  icon: "JobIconChiefMedicalOfficer"
  supervisors: job-supervisors-captain
  canBeAntag: false
  guides: # goobstation
  # - Medical # Orion-Edit: this fork does not ship the upstream SOP entries
  # - ChiefMedicalOfficerSOP
  # - MedicalSOP
  # - Command
  - Chemicals
  - Virology
  goobcoins: 40 #Goob content
  salary: 120 # Orion
  payrollDepartmentAccount: Command # Orion
  access:
  - Medical
  - Command
  - Maintenance
  - Chemistry
  - ChiefMedicalOfficer
  - Brig
  - Cryogenics
  - External # goobstation
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
  # Shitmed Change
  - !type:AddComponentSpecial
    components:
    - type: SurgerySpeedModifier
      speedModifier: 2
  # Arcane-Start
  contracts:
  - DocumentContractEmploymentCommand
  alternateTitles:
  - CMOMedicalDirector
  - CMOHeadPhysician
  - CMOSeniorMedicalOfficer
  - CMOWardSupervisor
  # Arcane-End

- type: startingGear
  id: CMOGear
  equipment:
    id: CMOPDA
    ears: ClothingHeadsetAltMedical # Goobstation
    eyes: ClothingEyesGlassesMedChemFlash #Omu
    belt: ClothingBeltMedicalFilled
  storage:
    back:
    - Flash
    - TelescopicBaton # Goobstation

- type: chameleonOutfit
  id: ChiefMedicalOfficerChameleonOutfit
  job: ChiefMedicalOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretCmo
    eyes: ClothingEyesGlassesMedChemFlash # Omu
    mask: ClothingMaskSterile
    neck: ClothingCloakCmo
    outerClothing: ClothingOuterCoatLabCmo
    gloves: ClothingHandsGlovesNitrile

# Arcane-Start
- type: jobAlternateTitle
  id: CMOMedicalDirector
  name: job-name-alt-cmo-1

- type: jobAlternateTitle
  id: CMOHeadPhysician
  name: job-name-alt-cmo-2

- type: jobAlternateTitle
  id: CMOSeniorMedicalOfficer
  name: job-name-alt-cmo-3

- type: jobAlternateTitle
  id: CMOWardSupervisor
  name: job-name-alt-cmo-4
# Arcane-End
