- type: job
  id: Detective
  name: job-name-detective
  description: job-description-detective
  playTimeTracker: JobDetective
  requirements:
  - !type:RoleTimeRequirement
    role: JobSecurityOfficer
    time: 5h
  startingGear: DetectiveGear
  icon: "JobIconDetective"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  # Orion-Edit-Start
  - SpaceLaw
  - SOP-Security-Detective
  - SOP-Security
  # Orion-Edit-End
  goobcoins: 30 #Goob content
  # Orion-Start
  salary: 80
  payrollDepartmentAccount: Security
  # Orion-End
  access:
  - Security
  - Brig
  - Maintenance
  - Detective
  - Cryogenics
  - External
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff
  # Arcane-start
  contracts:
  - DocumentContractEmploymentSecurity
  alternateTitles:
  - DetectiveForensicInvestigator
  # Arcane-end

- type: startingGear
  id: DetectiveGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: DetectivePDA
    #gloves: ClothingHandsGlovesForensic - Goobstation, moved to loadouts
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
    belt: ClothingBeltHolsterFilled
    pocket1: WeaponDisabler # Orion
  storage:
    back:
    - Flash
    - ForensicPad
    - ForensicScanner
#    - ClothingMaskGasSecurity # Goobstation # Orion-Edit: Now in BoxSurvival

- type: chameleonOutfit
  id: DetectiveChameleonOutfit
  job: Detective
  hasMindShield: true
  equipment:
    head: ClothingHeadHatFedoraBrown
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckTieDet
    gloves: ClothingHandsGlovesForensic

# Arcane-Start
- type: jobAlternateTitle
  id: DetectiveForensicInvestigator
  name: job-name-alt-detective-1
# Arcane-End
