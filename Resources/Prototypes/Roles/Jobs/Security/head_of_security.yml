- type: job
  id: HeadOfSecurity
  name: job-name-hos
  description: job-description-hos
  playTimeTracker: JobHeadOfSecurity
  requirements:
    - !type:RoleTimeRequirement
      role: JobWarden
      time: 5h # Goobstation
    - !type:RoleTimeRequirement
      role: JobDetective
      time: 1h # knowing how to use the tools is important
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 10h # Goobstation
    - !type:DepartmentTimeRequirement
      department: Security
      time: 10h
      # Arcane-start
    # - !type:SpeciesRequirement # Goob - None Felinid
      # inverted: true
      # species:
      # - Felenid
      # Arcane-end
  weight: 10
  startingGear: HoSGear
  icon: "JobIconHeadOfSecurity"
  supervisors: job-supervisors-captain
  canBeAntag: false
  guides:
  - SpaceLaw
  - SOP-Security-HeadOfSecurity # Orion
  - SOP-Security # Orion
  - SOP-Alerts # Orion
  goobcoins: 45 #Goob content
  salary: 120 # Orion
  payrollDepartmentAccount: Command # Orion
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: SecurityStaff # goobstation
  # Arcane-Start
  contracts:
  - DocumentContractEmploymentCommand
  alternateTitles:
  - HOSSecurityCommander
  - HOSChiefWarden
  - HOSSheriff
  # Arcane-End

- type: startingGear
  id: HoSGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: HoSPDA
    #gloves: ClothingHandsGlovesCombat - Goobstation, moved to loadouts
    ears: ClothingHeadsetAltSecurity
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - MagazinePistol

- type: chameleonOutfit
  id: HeadOfSecurityChameleonOutfit
  job: HeadOfSecurity
  hasMindShield: true
  equipment:
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckCloakHos

# Arcane-Start
- type: jobAlternateTitle
  id: HOSSecurityCommander
  name: job-name-alt-hos-1

- type: jobAlternateTitle
  id: HOSChiefWarden
  name: job-name-alt-hos-2

- type: jobAlternateTitle
  id: HOSSheriff
  name: job-name-alt-hos-3
# Arcane-End
