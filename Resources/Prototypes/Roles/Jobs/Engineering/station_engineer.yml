- type: job
  id: StationEngineer
  name: job-name-engineer
  description: job-description-engineer
  playTimeTracker: JobStationEngineer
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 2.5h
  startingGear: StationEngineerGear
  icon: "JobIconStationEngineer"
  supervisors: job-supervisors-ce
  guides: [ Engineering ] # goobstation
  goobcoins: 20 #Goob content
  # Orion-Start
  salary: 80
  payrollDepartmentAccount: Engineering
  # Orion-End
  access:
  - Maintenance
  - Engineering
  - External
  extendedAccess:
  - Atmospherics
  special: # Goobstation
  - !type:AddComponentSpecial
    components:
    - type: EngineeringStaff
  # Arcane-start
  contracts:
  - DocumentContractEmploymentEngineering
  alternateTitles:
  - StationEngineerMaintenanceTechnician
  - StationEngineerMechanic
  - StationEngineerElectrician
  - StationEngineerEngineOperator
  - StationEngineerDamageControlTechnician
  - StationEngineerArchitect
  # Arcane-end

- type: startingGear
  id: StationEngineerGear
  equipment:
#    eyes: ClothingEyesGlassesMeson # Orion-Edit: In loadout
    belt: ClothingBeltUtilityEngineering
    ears: ClothingHeadsetEngineering
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: StationEngineerChameleonOutfit
  job: StationEngineer
  equipment:
    head: ClothingHeadHatHardhatYellow
    mask: ClothingMaskBreath
    neck: ClothingNeckScarfStripedOrange
    outerClothing: ClothingOuterWinterEngi
    gloves: ClothingHandsGlovesColorYellow
    shoes: ClothingShoesBootsMag

# Arcane-Start
- type: jobAlternateTitle
