- type: gameMap
  id: WonderBox
  mapName: 'WonderBox Station'
  mapPath: /Maps/_Arcane/WonderBox.yml
  minPlayers: 25
  stations:
    WonderBoxStation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} WonderBox Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_courser.yml
        - type: StationJobs
          availableJobs:
            # Command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Adjutant: [ 1, 1 ]
            CommandMaid: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ]
            BlueshieldOfficer: [ 1, 1 ]
            # Service
            Bartender: [ 4, 2 ]
            Botanist: [ 4, 3 ]
            Janitor: [ 5, 4 ]
            Chef: [ 4, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 3, 2 ]
            ServiceWorker: [ 7, 5 ]
            Reporter: [ 3, 2 ]
            RadioHost: [ 1, 1 ]
            Musician: [ 3, 3 ]
            # Engineering
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 10, 7 ]
            AtmosphericTechnician: [ 4, 3 ]
            TechnicalAssistant: [ 5, 5 ]
            # Medical
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 7, 5 ]
            Paramedic: [ 3, 2 ]
            MedicalIntern: [ 4, 4 ]
            Chemist: [ 3, 3 ]
            Virologist: [ 2, 1 ]
            Psychologist: [ 1, 1 ]
            # Science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 8, 5 ]
            Roboticist: [ 4, 3 ]
            ResearchAssistant: [ 6, 5 ]
            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            Brigmedic: [ 2, 1 ]
            SecurityOfficer: [ 6, 4 ]
            SecurityCadet: [ 7, 4 ]
            Lawyer: [ 3, 3 ]
            IAA: [ 1, 1 ]
            # Supply
            Quartermaster: [ 1, 1 ]
            CargoTechnician: [ 7, 5 ]
            SalvageSpecialist: [ 4, 3 ]
            ShaftMiner: [ 4, 3 ]
            # Civilian
            Clown: [ 2, 1 ]
            Mime: [ 1, 1 ]
            Passenger: [ -1, -1 ]
            # Silicon
            StationAi: [ 1, 1 ]
            Borg: [ 5, 2 ]

        # For Goob blob
        - type: StationBlobConfig
          stageBegin: 40
          stageCritical: 450
          stageTheEnd: 900
