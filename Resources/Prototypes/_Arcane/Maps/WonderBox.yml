- type: gameMap
  id: WonderBox
  mapName: 'WonderBox Station'
  mapPath: /Maps/_Arcane/WonderBox.yml
  minPlayers: 40
  stations:
    WonderBoxStation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} WonderBox Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
        - type: StationJobs
          availableJobs:
            # Command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Adjutant: [ 1, 1 ]
            CommandMaid: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ]
            BlueshieldOfficer: [ 1, 1 ]
            # Service
            Bartender: [ 3, 3 ]
            Botanist: [ 3, 3 ]
            Janitor: [ 4, 4 ]
            Chef: [ 3, 3 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 2, 2 ]
            ServiceWorker: [ 6, 6 ]
            Reporter: [ 2, 2 ]
            RadioHost: [ 1, 1 ]
            Musician: [ 2, 2 ]
            # Engineering
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 7, 7 ]
            AtmosphericTechnician: [ 3, 3 ]
            TechnicalAssistant: [ 5, 5 ]
            # Medical
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 5, 5 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]
            Chemist: [ 3, 3 ]
            Virologist: [ 2, 1 ]
            Psychologist: [ 1, 1 ]
            # Science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 5, 5 ]
            Roboticist: [ 3, 3 ]
            ResearchAssistant: [ 4, 4 ]
            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            SecurityOfficer: [ 6, 6 ]
            SecurityCadet: [ 4, 4 ]
            Lawyer: [ 2, 2 ]
            IAA: [ 1, 1 ]
            # Supply
            Quartermaster: [ 1, 1 ]
            CargoTechnician: [ 6, 6 ]
            SalvageSpecialist: [ 3, 3 ]
            ShaftMiner: [ 3, 3 ]
            # Civilian
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Passenger: [ -1, -1 ]
            # Silicon
            StationAi: [ 1, 1 ]
            Borg: [ 4, 4 ]

        # For Goob blob
        - type: StationBlobConfig
          stageBegin: 40
          stageCritical: 450
          stageTheEnd: 900