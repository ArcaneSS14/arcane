- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateArmoryRandomPistol
  name: random pistol crate
  description: Contains a random assortment of pistols with magazines. Requires Armory access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillCrateArmoryRandomPistol

