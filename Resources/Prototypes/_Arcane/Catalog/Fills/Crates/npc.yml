- type: entity
  parent: CrateLivestock
  id: CrateNPCTiger
  name: tiger crate
  description: A crate containing a single, highly dangerous tiger. Handle with extreme care.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MobTiger

- type: entity
  parent: CrateLivestock
  id: CrateNPCCrocodile
  name: crocodile crate
  description: A crate containing a single crocodile. It seems angry.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MobCrocodile

- type: entity
  parent: CrateLivestock
  id: CrateNPCTurtle
  name: crate of turtles
  description: A crate containing three slow turtles.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MobTurtle
        amount: 3

- type: entity
  parent: CrateLivestock
  id: CrateNPCRabbit
  name: crate of rabbits
  description: A crate containing three fluffy rabbits.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MobRabbit
        amount: 3

- type: entity
  parent: CrateLivestock
  id: CrateNPCSeal
  name: crate of seals
  description: A crate containing two chubby seals.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MobSeal
        amount: 2

- type: entity
  parent: CrateGenericSteel
  id: CrateFoodExotic
  name: exotic food crate
  description: A crate filled with exotic dishes from the far reaches of space.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FoodBakedTigerRoll
          amount: 3
        - id: FoodSoupCrocodileStew
          amount: 3
        - id: FoodSoupTurtleSoup
          amount: 3
        - id: FoodBakedRabbit
          amount: 3
