    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff
  # Arcane-start
  contracts:
  - DocumentContractEmploymentSecurity
  # Arcane-end

- type: startingGear
  id: SecurityPilotGear
  equipment:
    eyes: ClothingEyesGlassesSecurityPilot
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
    pocket1: WeaponDisabler # Orion-Edit: PistolMk58 > Disabler
    gloves: ClothingHandsGlovesCombat
  storage:
    back:
    - Flash
