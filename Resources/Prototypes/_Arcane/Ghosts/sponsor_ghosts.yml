- type: customGhost
  id: ArcaneSponsorGhost
  abstract: true
  category: sponsor
  alwaysVisible: true
  restrictions:
  - !type:SponsorGhostRestriction

- type: customGhost
  parent: ArcaneSponsorGhost
  id: sponsorWalker
  entity: MobObserverSponsorWalker
  name: custom-ghost-sponsor-walker-name
  description: custom-ghost-sponsor-walker-desc

- type: entity
  parent: MobObserver
  id: MobObserverSponsorWalker
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Arcane/Ghosts/sponsor/walker.rsi
    layers:
    - state: walker
      shader: unshaded

