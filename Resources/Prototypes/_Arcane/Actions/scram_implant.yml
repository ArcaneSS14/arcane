- type: entity
  parent: BaseAction
  id: ActionArcaneScramImplant
  name: SCRAM!
  description: Randomly teleports you within a large distance.
  categories: [ HideSpawnMenu ]
  components:
  - type: LimitedCharges
    maxCharges: 3
  - type: Action
    checkCanInteract: false
    useDelay: 30
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Structures/Specific/anomaly.rsi
      state: anom4
  - type: InstantAction
    event: !type:ScramImplantEvent
