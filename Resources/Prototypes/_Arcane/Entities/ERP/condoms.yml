- type: entity
  parent: FoodPacketTrash
  id: CondomTrash
  components:
  - type: Sprite
    sprite: _Arcane/ERP/condoms.rsi
    state: condom-trash
  - type: Item
    sprite: _Arcane/ERP/condoms.rsi
    size: Tiny

- type: entity
  parent: ClothingUnderwearBase
  id: ClothingUnderwearCondom
  name: condom
  description: One of the most common contraceptives. Don't forget to wear it!
  components:
  - type: Sprite
    sprite: _Arcane/ERP/condoms.rsi
    state: icon1
  - type: Item
    size: Tiny
    sprite: _Arcane/ERP/condoms.rsi
  - type: Clothing
    sprite: _Arcane/ERP/condoms.rsi
  - type: Condom
  - type: SolutionContainerManager
    solutions:
      condom:
        maxVol: 10

- type: entity
  parent: ClothingUnderwearCondom
  id: ClothingUnderwearCondomFilled
  name: used condom
  description: A rubber sheath full of dried up cum. Best not to put that back on.
  components:
  - type: Sprite
    state: icon-used
  - type: Condom
    full: true
  # Shatters like a drinking glass, just noisier and wetter.
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/balloon-pop.ogg
      - !type:SpillBehavior
        solution: condom
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: [BaseItem]
  id: Condom
  name: condom
  description: One of the most common contraceptives. Don't forget to wear it!
  components:
  - type: Sprite
    sprite: _Arcane/ERP/condoms.rsi
    state: icon
  - type: Item
    size: Tiny
    sprite: _Arcane/ERP/condoms.rsi
  - type: SpawnItemsOnUse
    items:
      - id: CondomTrash
      - id: ClothingUnderwearCondom
    sound:
      path: /Audio/Effects/unwrap.ogg
