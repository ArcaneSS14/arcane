- type: constructionGraph
  id: ClothingStraponHuman
  start: start
  graph:
    - node: start
      edges:
        - to: erp
          steps:
            - tag: HumanDildo
              name: construction-graph-tag-dildo-human
              icon:
                sprite: _Arcane/ERP/Toys/Dildo/human.rsi
                state: icon
            - tag: Strapon
              name: construction-graph-tag-strapon
              icon:
                sprite: _Arcane/ERP/Toys/Strapon/strapon.rsi
                state: icon
              doAfter: 3
    - node: erp
      entity: ClothingStraponHuman
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: HumanDildo
              amount: 1
            - !type:SpawnPrototype
              prototype: ClothingStrapon
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Cutting
              doAfter: 3

