      enum.AnimalVisuals.TurtleHide:
        enum.AnimalVisuals.TurtleHide:
          True: { visible: true }
          False: { visible: false }
        "movement":
          True: { visible: false }
          False: { visible: true }
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
