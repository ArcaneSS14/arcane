- type: entity
  parent: [ SimpleMobBase ]
  id: MobCheremsha
  name: cheremsha
  description: Quietly, unhurried, not breathing, not shushing. Four pencils, not squishing, not buzzing, not a penny, cheremsha, not grieving, lying down, trembling, cheremsha. Stirring without a ladle, from the second floor, without a garage, without a crew, without extra luggage, without a massage, without installation, without camouflage, cheremsha. For the ambiance. Without knowing the case, without a mutiny. With three knives, two flatbreads, cheremsha. Without a report, without tenure. With the face of a leader, with the soul of a walrus. With the habits of a hedgehog, with the smell of rust. Cheremsha.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cheremsha
      sprite: _Arcane/Mobs/Animals/cheremsha.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 10
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cheremsha
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
  - type: Tag
    tags:
    - VimPilot

- type: entity
  parent: [ SimpleMobBase, MobCombat ]
  id: MobTiger
  name: tiger
  description: Bad kitty!
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Arcane/Mobs/Animals/tiger.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: tiger_alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: tiger_alive
      Critical:
        Base: tiger_dead
      Dead:
        Base: tiger_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      250: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.8
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/_Arcane/Animals/tiger_roar.ogg
    damage:
      types:
        Slash: 12
        Piercing: 6
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 4
    - id: MaterialTigerPelt
      amount: 1
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: InteractionPopup
    successChance: 0.1
    interactSuccessString: petting-success-tiger
    interactFailureString: petting-failure-tiger
    interactSuccessSound:
      path: /Audio/_Arcane/Animals/tiger_roar.ogg
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
    - Tiger

