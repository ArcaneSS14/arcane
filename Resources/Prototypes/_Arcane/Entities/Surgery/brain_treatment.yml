- type: entity
  parent: SurgeryBase
  id: SurgeryTreatBrain
  name: Neurosurgery
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepTreatBrain
  - type: SurgeryPartCondition
    parts: [Head]
  - type: SurgeryPartComponentCondition
    inverse: false
    components:
    - type: IncisionOpen
    - type: BonesSawed
    - type: BleedersClamped
  - type: SurgeryRoboticVariant
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryOrganCondition
    organ:
    - type: Brain

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepTreatBrain
  name: Repair brain tissue
  components:
  - type: SurgeryStep
    duration: 10.5
    tool:
    - type: Hemostat
  - type: SurgeryBrainTreatment
  - type: SurgeryRepeatableStep
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
