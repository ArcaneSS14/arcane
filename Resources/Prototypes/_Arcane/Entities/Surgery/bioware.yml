- type: entity
  parent: SurgeryBiowareBase
  id: SurgeryVeinThreading
  name: Vein Threading
  components:
  - type: Surgery
    steps:
    - SurgeryStepThreadVeins
  - type: SurgeryBodyComponentCondition
    inverse: true
    components:
    - type: BloodBioware

- type: entity
  parent: SurgeryBiowareBase
  id: SurgeryNerveSplicing
  name: Nerve Splicing
  components:
  - type: Surgery
    steps:
    - SurgeryStepSpliceNerves
  - type: SurgeryBodyComponentCondition
    inverse: true
    components:
    - type: NerveBioware

- type: entity
  parent: SurgeryBiowareBase
  id: SurgeryNerveGrounding
  name: Nerve Grounding
  components:
  - type: Surgery
    steps:
    - SurgeryStepGroundNerves
  - type: SurgeryBodyComponentCondition
    inverse: true
    components:
    - type: NerveBioware

- type: entity
  parent: SurgeryStepBiowareBase
  id: SurgeryStepThreadVeins
  name: Thread the veins
  components:
  - type: SurgeryBioware
    name: surgery-bioware-threaded-veins
    category: Blood
    bleedMultiplier: 0.25

- type: entity
  parent: SurgeryStepBiowareBase
  id: SurgeryStepSpliceNerves
  name: Splice the nerves
  components:
  - type: SurgeryStep
    duration: 15.5
  - type: SurgeryBioware
    name: surgery-bioware-spliced-nerves
    category: Nerves
    stunMultiplier: 0.5
    staminaMultiplier: 0.8

- type: entity
  parent: SurgeryStepBiowareBase
  id: SurgeryStepGroundNerves
  name: Ground the nerves
  components:
  - type: SurgeryStep
    duration: 15.5
  - type: SurgeryBioware
    name: surgery-bioware-grounded-nerves
    category: Nerves
    shockImmune: true
