# modular_splurt/code/modules/clothing/kinkyclothes.dm (/obj/item/clothing/shoes/highheels).

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesHighHeels
  name: high heels
  description: They make the wearer appear taller, and more noisy!
  components:
  - type: Sprite
    sprite: _Arcane/Clothing/Shoes/high_heels.rsi
  - type: Clothing
    sprite: _Arcane/Clothing/Shoes/high_heels.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
      - state: cutout-FEET
        shader: ArcaneClothingCutout
  - type: ClothingSpriteCutout
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHighHeels
      params:
        volume: -6
        variation: 0.09
