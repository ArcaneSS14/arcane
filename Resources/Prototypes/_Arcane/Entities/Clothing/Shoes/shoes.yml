- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesHeelsThin
  name: thin-heel shoes
  description: Shoes with a thin, unstable heel.
  abstract: true
  components:
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHighHeels
      params:
        volume: -6
        variation: 0.09
  - type: HeelSlip
    slipChance: 0.05
    runSpeedThreshold: 3.0
    slowdownModifier: 0.25
    slowdownDurationMin: 3
    slowdownDurationMax: 5
    knockdownTime: 4.5

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBeer
  name: beer shoes
  description: Beer shoes.
  components:
  - type: Sprite
    sprite: _Arcane/Clothing/Shoes/beer_shoes.rsi
  - type: Clothing
    sprite: _Arcane/Clothing/Shoes/beer_shoes.rsi

