- type: entity
  parent: [ Clothing, BaseSyndicateAnchoredContraband ]
  categories: [ DoNotMap ]
  id: ClothingHandsGlovesBlackSilence
  name: sorrowful gloves
  description: I have nothing but my sorrow...
  components:
  - type: Sprite
    sprite: _Arcane/Clothing/Hands/Gloves/black_silence_gloves.rsi
    state: icon
  - type: Clothing
    slots: [gloves]
    sprite: _Arcane/Clothing/Hands/Gloves/black_silence_gloves.rsi
    equipSound:
      path: /Audio/_Goobstation/Items/handling/generic_equip2.ogg
      params:
        volume: -4
  - type: Item
    size: Small
    storedRotation: -90
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 5
  - type: Armor
    coverage:
    - Hand
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Shock: 0.75
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-silence
  - type: InclothingTools
    maxEquippedTools: 1
    forseDropHeldItem: true
    toolPrototypes:
    - WeaponSniperMosin
    - BetrayalKnife
    - WeaponPistolAnaconda
    - CrystalAtelierSword
    - Katana
    - FireAxeFlaming
    - Claymore
    - Sledgehammer
    - BlueshieldMace
    - CburnSpear
    - InquisitorChainSword
  - type: RandomInclothingTools
  - type: UserInterface
    interfaces:
      enum.SelectInclothingToolUiKey.Key:
        type: InclothingToolsBoundUserInterface
  - type: ContainerContainer
    containers:
      inclothing-tools: !type:Container {}
  - type: Tag
    tags:
    - WhitelistChameleon