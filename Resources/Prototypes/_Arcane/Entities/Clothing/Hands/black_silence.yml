- type: entity
  parent: [ ClothingHandsGlovesColorBlack, BaseSyndicateAnchoredContraband ]
  id: ClothingHandsGlovesBlackSilence
  name: sorrowful gloves
  description: I have nothing but my sorrow...
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/combat.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/combat.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-silence
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Shock: 0.75
  - type: InclothingTools
    maxEquippedTools: 1
    forseDropHeldItem: true
    toolPrototypes:
    - WeaponSniperMosin
    - BetrayalKnife
    - WeaponPistolAnaconda
    - Wakizashi
    - Katana
    - FireAxeFlaming
    - Claymore
    - Sledgehammer
    - BlueshieldMace
    - CburnSpear
    - InquisitorChainSword
  - type: RandomInclothingTools
  - type: UserInterface
    interfaces:
      enum.SelectInclothingToolUiKey.Key:
        type: InclothingToolsBoundUserInterface
  - type: ContainerContainer
    containers:
      inclothing-tools: !type:Container {}