- type: entity
  parent: [ TranslatorPoweredBase ]
  id: KarshanTranslator
  name: Karshan translator
  description: Translates speech between Karshan and Tau-Ceti Basic. For talking to Demons!
  components:
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Karshan
    understood:
    - TauCetiBasic
    - Karshan
    requires:
    - TauCetiBasic
    - Karshan

- type: entity
  parent: [ TranslatorPoweredBase ]
  id: DwarvishTranslator
  name: Dwarvish translator
  description: Translates speech between Dwarvish and Tau-Ceti Basic. For talking to Dwarves!
  components:
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Dwarvish
    understood:
    - TauCetiBasic
    - Dwarvish
    requires:
    - TauCetiBasic
    - Dwarvish
