  description: A device for wirelessly transferring energy from a battery to other devices.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Tools/Inducer/inducer-security.rsi
    state: icon
  - type: ItemMapper
    mapLayers:
      inducer-bat:
        whitelist:
