- type: entity
  id: FlippoLighterRegenerating
  parent: FlippoLighter
  name: self-refilling flippo lighter
  description: A rugged metal lighter that slowly refills its own fuel tank.
  components:
  - type: SolutionRegeneration
    solution: Welder
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.01
