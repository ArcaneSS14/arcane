    reagents:
      # Common cooking ingredients
      Flour: 4
      Cornmeal: 4
      Rice: 4
      Egg: 12
      Milk: 12
      Sugar: 3
      Water: 3
      # Uncommon ingredients
      Fat: 20
      UncookedAnimalProteins: 20
      Nutriment: 20
      Blood: 20
      Carbon: 20 #Да, я это сделал ради рецепта мяса, и надеюсь вы НИЧЕГО с этим не поделаете (25u Fat, 5u Nutriment, 10u Blood, 10u Carbon)
      MilkSoy: 16
      Oats: 14
      Vinegar: 8
      OilOlive: 5
      # Condiments
      TableSalt: 2
      Blackpepper: 2
      BbqSauce: 2
      Soysauce: 4
      Mustard: 3
      Ketchup: 3
      Mayo: 3
      Hotsauce: 3
      Syrup: 3
      Vinaigrette: 4
      Astrotame: 8
