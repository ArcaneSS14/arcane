# Portable, battery-powered versions of the EnergyBoozeDispenser / EnergySodaDispenser / ServiceEnergyChemDispenser
# machines (see Resources/Prototypes/_Goobstation/Entities/Structures/Machines/dispensers.yml), reworked as
# cyborg hand items for the bartending and culinary borg modules. They use BatterySelfRecharger instead of
# station power so they work while held.

- type: entity
  id: BorgHandBoozeDispenser
  parent: BaseItem
  name: handheld booze dispenser
  description: A bluespace booze dispenser shrunk down and battery-powered for cyborg use.
  components:
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    state: booze
  - type: Item
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRechargeRate: 20
  - type: ActivatableUI
    key: enum.EnergyReagentDispenserUiKey.Key
  - type: UserInterface
    interfaces:
      enum.EnergyReagentDispenserUiKey.Key:
        type: EnergyReagentDispenserBoundUserInterface
  - type: EnergyReagentDispenser #Keep on bottom for view's sake, format is reagentProto: Cost
    energyBeakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
    reagents:
      Absinthe: 24
      Ale: 12
      Beer: 8
      BlueCuracao: 14
      Champagne: 26
      CoffeeLiqueur: 16
      Cognac: 22
      Gildlager: 26
      Gin: 16
      Mead: 15
      MelonLiquor: 14
      Patron: 24
      Rum: 18
      Sake: 12
      Tequila: 20
      Vermouth: 14
      Vodka: 18
      Whiskey: 20
      Wine: 12

