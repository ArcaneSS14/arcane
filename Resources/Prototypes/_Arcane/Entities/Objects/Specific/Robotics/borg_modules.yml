- type: entity
  id: BorgModuleHydroponics
  parent: [ BaseBorgModuleService, BaseProviderBorgModule ]
  name: hydroponics cyborg module
  description: A service module combining gardening and harvesting tools for growing and reaping crops, with a slot for carrying seeds.
  components:
  - type: Sprite
    layers:
    - state: service
    - state: icon-gardening
  - type: ItemBorgModule
    hands:
    - item: Bucket
    - item: HydroponicsToolMiniHoe
    - item: HydroponicsToolSpade
    - item: HydroponicsToolClippers
    - item: HydroponicsToolScythe
    - item: HydroponicsToolHatchet
    - item: PlantBag
    - item: WheatSeeds
      hand:
        emptyLabel: borg-slot-seeds-empty-arcane
        emptyRepresentative: WheatSeeds
        whitelist:
          components:
          - Seed
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: gardening-module }

- type: entity
  id: BorgModuleBartending
  parent: [ BaseBorgModuleService, BaseProviderBorgModule ]
  name: bartending cyborg module
  description: A service module equipped with self-contained booze and soda dispensers, a shaker, two glasses, a self-refilling lighter, and two cigarette slots for on-the-go bartending.
  components:
  - type: Sprite
    layers:
    - state: service
  - type: ItemBorgModule
    hands:
    - item: BarSpoon
    - item: BorgHandBoozeDispenser
    - item: BorgHandSodaDispenser
    - item: DrinkShaker
      hand:
        emptyLabel: borg-slot-small-containers-empty
        emptyRepresentative: DrinkShaker
        whitelist:
          components:
          - FitsInDispenser
    - item: DrinkGlass
      hand:
        emptyLabel: borg-slot-glasses-empty-arcane
        emptyRepresentative: DrinkGlass
        whitelist:
          components:
          - FitsInDispenser
    - item: DrinkGlass
      hand:
        emptyLabel: borg-slot-glasses-empty-arcane
        emptyRepresentative: DrinkGlass
        whitelist:
          components:
          - FitsInDispenser
    - hand:
        emptyLabel: borg-slot-cigarettes-empty-arcane  
        emptyRepresentative: Cigarette
        whitelist:
          tags:
          - CigStorage
          - Cigarette
          - Cigar
          components:
          - FitsInDispenser 
    - item: CigPackBlack
      hand:
        emptyLabel: borg-slot-cigarettes-empty-arcane
        emptyRepresentative: CigPackBlack
        whitelist:
          tags:
          - CigStorage
          - Cigarette
          - Cigar
          components:
          - FitsInDispenser
    - item: FlippoLighterRegenerating
  - type: BorgModuleIcon
    icon: { sprite: _Arcane/Interface/Actions/actions_borg.rsi, state: bartending-module }

- type: entity
  id: BorgModuleCooking
  parent: [ BaseBorgModuleService, BaseProviderBorgModule ]
  name: culinary cyborg module
  description: A service module equipped with a self-contained food synthesizer, a knife, a rolling pin, flour, baking enzyme, and slots for carrying ingredients.
  components:
  - type: Sprite
    layers:
    - state: service
  - type: ItemBorgModule
    hands:
    - item: BorgHandFoodDispenser
    - item: Beaker
      hand:
        emptyLabel: borg-slot-chemical-containers-empty
        emptyRepresentative: Beaker
        whitelist:
          components:
          - FitsInDispenser
    - item: KitchenKnife
    - item: RollingPin
    - item: ReagentContainerFlour
      hand:
        emptyLabel: borg-slot-ingredients-empty-arcane
        emptyRepresentative: ReagentContainerFlour
        whitelist:
          components:
          - Edible
    - item: FoodCondimentBottleEnzyme
      hand:
        emptyLabel: borg-slot-ingredients-empty-arcane
        emptyRepresentative: FoodCondimentBottleEnzyme
        whitelist:
          components:
          - Edible
    - item: FoodMeat
      hand:
        emptyLabel: borg-slot-ingredients-empty-arcane
        emptyRepresentative: FoodMeat
        whitelist:
          components:
          - Edible
    - item: FoodCarrot
      hand:
        emptyLabel: borg-slot-ingredients-empty-arcane
        emptyRepresentative: FoodCarrot
        whitelist:
          components:
          - Edible
  - type: BorgModuleIcon
    icon: { sprite: _Arcane/Interface/Actions/actions_borg.rsi, state: cooking-module }
