- type: entity
  parent: FoodBakedBase
  id: FoodBakedTigerRoll
  name: biscuit roll
  description: A chocolate roll. The tiger pelt stays inside.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Consumable/Food/tiger_biscuit.rsi
    state: sponge_cake_roll
  - type: SliceableFood
    count: 5
    slice: FoodBakedTigerRollPiece
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Nutriment
          Quantity: 25
        - ReagentId: Theobromine
          Quantity: 5
  - type: Tag
    tags:
    - Cake
    - Meat

- type: entity
  parent: FoodBakedBase
  id: FoodBakedTigerRollPiece
  name: biscuit roll piece
  description: A slice of chocolate biscuit roll.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Consumable/Food/tiger_biscuit.rsi
    state: sponge_cake_roll_piece
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Theobromine
          Quantity: 1
  - type: Tag
    tags:
    - Cake
    - Meat
    - Slice

- type: entity
  parent: FoodBowlBase
  id: FoodSoupCrocodileStew
  name: stewed crocodile
  description: A hearty crocodile tail stew. The tail stays in the bowl.
  components:
  - type: FlavorProfile
    flavors:
    - meaty
    - savory
  - type: Sprite
    layers:
    - sprite: Objects/Consumable/Food/bowl.rsi
      state: bowl2
    - sprite: _Arcane/Objects/Consumable/Food/crocodile_stew.rsi
      state: crocodile_stew
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
        - ReagentId: Vitamin
          Quantity: 5
        - ReagentId: Water
          Quantity: 10
  - type: Tag
    tags:
    - Meat
    - Soup

