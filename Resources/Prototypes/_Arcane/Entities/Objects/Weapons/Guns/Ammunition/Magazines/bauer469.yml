- type: entity
  id: ArcaneBaseMagazineBauer469
  name: magazine (15mm anti-materiel)
  description: A large magazine for a heavy weapon, holds 15x115mm anti-materiel rounds.
  parent: [ BaseItem, BaseMajorContraband ]
  abstract: true
  components:
  - type: Sprite
    netsync: false
    sprite: _Arcane/Objects/Weapons/Guns/Ammunition/Magazines/Rifle/sr469_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-6
  - type: Tag
    tags:
    - ArcaneMagazineBauer469
  - type: Item
    size: Tiny
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ArcaneCartridgeAntiMateriel
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false
  - type: Appearance

