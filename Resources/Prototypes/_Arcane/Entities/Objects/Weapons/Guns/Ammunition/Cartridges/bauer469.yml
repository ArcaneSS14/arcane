- type: entity
  parent: [ BaseCartridge, BaseMajorContraband ]
  id: ArcaneCartridgeAntiMateriel
  name: cartridge (15mm anti-materiel)
  description: A high-power cartridge used by high-precision rifles.
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeAntiMateriel
    - ArcaneCartridgeAntiMateriel
  - type: CartridgeAmmo
    proto: ArcaneBulletAntiMaterielTracked
  - type: Sprite
    scale: 0.8,0.8
    sprite: _Arcane/Objects/Weapons/Guns/Ammunition/Casings/12.7x99.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#B68F0E"
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 20

