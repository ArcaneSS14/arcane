- type: entity
  name: luminous orb
  parent: BaseItem
  id: MagicLuminousOrb
  description: Guiding light in the darkness.
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: PointLight
    radius: 7
    energy: 1.5
    color: "#00CCFF"
  - type: Appearance
  - type: Unremoveable

- type: entity
  name: Ember
  parent: BaseItem
  id: MagicEmber
  description: A source of flame, fueled by the power of the mind.
  components:
  - type: Sprite
    sprite:  _Arcane/Objects/Magic/ember.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: Item
    sprite: _Arcane/Objects/Magic/ember.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 6
    color: "#f06b2e"
  - type: Unremoveable
  - type: Cautery
    speed: 0.20
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
    endSound:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
  - type: IgnitionSource
    ignited: true
  - type: AlwaysHot

- type: entity
  name: mystic mop
  parent: BaseItem
  id: MagicMop
  description: A mop. Yes, literally mop.
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    color: "#00CCFF"
    layers:
    - state: icon
      shader: unshaded
  - type: PointLight
    radius: 0.5
    energy: 1
    color: "#00CCFF"
  - type: Unremoveable
  - type: DrainableSolution
    solution: drainBuffer
  - type: SolutionRegeneration
    solution: absorbed
    generated:
      reagents:
        - ReagentId: Water
          Quantity: 10
  - type: SolutionPurge
    solution: absorbed
    preserve:
      - Water
    quantity: 10
  - type: SolutionContainerManager
    solutions:
      absorbed:
        maxVol: 50
  - type: Absorbent
    pickupAmount: 10
