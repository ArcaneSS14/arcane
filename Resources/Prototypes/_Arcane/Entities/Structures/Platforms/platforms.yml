- type: entity
  parent: CMPlatformBaseDestructible
  id: PlatformWoodenDark
  name: dark wooden platform
  description: A raised level of dark wood, often used to elevate areas above others. You could probably climb it.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    sprite: _Arcane/Structures/arcaneplatforms.rsi
    state: wooden_dark_platform
  - type: Climbable

