      metabolismRate: 0.1
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -1
      - !type:AdjustTemperature
        amount: 2000
        conditions:
        - !type:Temperature
          max: 310.15
      - !type:AdjustTemperature
        amount: -2000
        conditions:
        - !type:Temperature
          min: 310.15
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "equiline-effect-feeling-balanced" ]
        probability: 0.1
