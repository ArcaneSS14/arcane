- type: species
  id: Demon
  name: species-name-demon
  roundStart: true
  prototype: MobDemon
  sprites: MobDemonSprites
  defaultSkinTone: "#34a223"
  markingLimits: MobDemonMarkingLimits
  dollPrototype: MobDemonDummy
  skinColoration: Hues
  naming: firstlast
  sexes: [Male, Female, Futanari]
  category: Unusual
  description: "/ServerInfo/_Arcane/SpeciesDescriptions/Demon.xml"
  minAge: 18
  maxAge: 250
  youngAge: 80
  oldAge: 175
  minHeight: 0.90
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.90
  defaultWidth: 1
  maxWidth: 1.10
  pros:
  - Получают на 40% меньше урона от огня и тепла.
  - Наносят колющий урон безоружными атаками.
  cons:
  - Стамина меньше на 10%, чем у человека.
  - Бегают немного медленнее человека.
  - Получают на 50% больше урона от святого оружия и источников.
  - Получают на 20% больше урона от холода.

