    Groin: MobDemonTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Wings: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobDemonLArm
    RArm: MobDemonRArm
    LHand: MobDemonLHand
    RHand: MobDemonRHand
    LLeg: MobDemonLLeg
    RLeg: MobDemonRLeg
    LFoot: MobDemonLFoot
    RFoot: MobDemonRFoot

- type: markingPoints
  id: MobDemonMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: false
    Chest:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ DemonTailDefault ]
    Snout:
      points: 1
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false
    Wings:
      points: 1
      required: false

