- type: flavor
  id: eldritch
  flavorType: Complex
  description: flavor-complex-eldritch

- type: reagent
  id: EldritchEssence
  parent: BaseDrink
  group: Unknown
  name: reagent-name-eldritch
  desc: reagent-desc-eldritch
  physicalDesc: reagent-physical-desc-eldritch
  flavor: eldritch
  color: "#1f8016"
  metabolisms:
    Medicine:
      metabolismRate: 0.25  # Arcane-Edit
      effects:
      - !type:ModifyBloodLevel
        amount: 6  # Arcane-Edit-
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:HealthChange
        damage:
          groups:
            # Arcane-Edit-Start
            Burn: -4
            Toxin: -4
            Airloss: -4
            Brute: -4
            Genetic: -4
            Metaphysical: -8
            # Arcane-Edit-End
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:ModifyBleed
        amount: -3  # Arcane-Edit
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:CleanBloodstream
        excluded: EldritchEssence
        cleanseRate: 3
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:GenericStatusEffect
        key: SeeingRainbows
        time: 50.0
        type: Remove
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
      - !type:TakeStaminaDamage
        amount: -10
        immediate: true
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
    Poison:
      metabolismRate: 0.25 # Arcane-Edit
      effects:
      - !type:Electrocute
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
          inverted: true
        probability: 0.5
      - !type:HealthChange
        damage:
          types:
            Poison: 2.5 # Arcane-Edit
        conditions:
        - !type:HasComponentCondition
          checkMind: true
          components:
          - type: Heretic
          - type: Ghoul
          guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
          inverted: true
  tileReactions:
  - !type:ChangeTileReaction # Rusts tile
