- type: entity
  parent: AdminPDA
  id: ChronoPDA
  name: futuristic PDA
  description: A powerful quantum computer disguised as a regular pda for disguise.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Devices/pda.rsi # Orion-Edit
  # Orion-Start
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda_base
      color: "#dee4e7"
    - state: pda_buttons
    - map: [ "enum.PdaVisualLayers.Screen" ]
      state: pda_screen_borders
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
    - state: "insert_overlay" # Goob
      map: [ "enum.PdaVisualLayers.Pen" ]
  # Orion-End
  - type: Appearance
    appearanceDataInit: &orionPdaAppearance
      enum.PdaVisuals.PdaType:
        !type:String
        pda_base
  - type: Pda
    id: ChronoIDCard
    penSlot:
      startingItem: PenFuture
      whitelist:
        tags:
        - Write
  - type: PdaBorderColor
    borderColor: "#dee4e7"
    accentVColor: "#59bcee"

