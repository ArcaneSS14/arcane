# The ID is what is searched for on the paper, coming after the target identifier.
# Any spaces on the written portion will be removed, so keep it all lowercase and one word.
#
# Aliases are stable, non-localized strings that can also be typed on the paper.
# They must NOT depend on FTL translations, so that input parsing keeps working
# even if a translation changes. See AGENTS.md, "Localization".

