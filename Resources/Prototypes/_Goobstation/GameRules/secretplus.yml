# middle setting: supposed to be a "normal round" baseline setting
- type: entity
  id: SecretPlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    # if you've come here due to "too many antags", lower chaos change for less midrounds and lower starting chaos for less roundstarts
    # Arcane-start
    minStartingChaos: 6 # scales per player
    maxStartingChaos: 16
    livingChaosChange: -0.01
    deadChaosChange: 0.016
    # Arcane-end
    # chance for greenshift as well as evilshift
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.1 # Arcane
    # often fires chud events so relatively low
    eventIntervalMin: 90
    eventIntervalMax: 400
    # there's some misc variables in the comp if you want to try tweaking those
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

# the Setting that Kills You
- type: entity
  id: SecretPlusAdmeme
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 40
    maxStartingChaos: 40 # ling-blob-nukeops is fun
    livingChaosChange: -0.03
    deadChaosChange: 0.03
    chaosExponent: 1
    eventIntervalMin: 60
    eventIntervalMax: 200 # hell
    primaryAntagsWeightTable: SecretPlusChaos
    ignoreIncompatible: true
    ignoreTimings: true # would run out of events otherwise

# greenshift setting
- type: entity
  id: SecretPlusLow
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    # Arcane-start
    minStartingChaos: 6
    maxStartingChaos: 12
    noRoundstartAntags: true
    livingChaosChange: -0.005
    deadChaosChange: 0.024
    chaosExponent: 1.5
    # Arcane-end
    eventIntervalMin: 150
    eventIntervalMax: 480

# survival+
# "baseline" ramping setting
- type: entity
  id: SecretPlusRampingMid
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 0
    maxStartingChaos: 0
    noRoundstartAntags: true
    speedRamping: 0.0002 # Arcane

#Low pop gamemode stuff taliored for the early hours of goob in the us
- type: entityTable
  id: SecretPlusTableLowpop
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: SpaceTrafficControlTable
      - !type:NestedSelector
        tableId: BasicGameRulesTableLowpop

- type: entity
  id: SecretPlusLowpop
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    eventIntervalMin: 120 # a little bit longer to keep pepole from dying fast
    eventIntervalMax: 420 # same thought as the former
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTableLowpop

# only spawns tots and theives allowing an antag to spawn in low pop- thus keeping the server entertained with gruel
# like the tot gamemode but (slightly?) more advanced.
- type: weightedRandom
  id: SecretPlusLowpop
  weights:
    # subgamemodes
    Thief: 0.2
    # normal
    Traitor: 1
