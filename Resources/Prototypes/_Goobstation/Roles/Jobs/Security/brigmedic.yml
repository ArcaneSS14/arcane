- type: job
  id: Brigmedic
  name: job-name-brigmedic
  description: job-description-brigmedic
  playTimeTracker: JobBrigmedic
  requirements:
  - !type:DepartmentTimeRequirement
    department: Medical
    time: 18000 # 5 hrs
  - !type:DepartmentTimeRequirement
    department: Security
    time: 18000 # 5 hrs
  startingGear: BrigmedicGear
  icon: "JobIconBrigmedic"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides:
  # Orion-Edit-Start
  - SOP-Security-Brigmedic
  # Orion-Edit-End
  - Medicine
  goobcoins: 35
  # Orion-Start
  salary: 80
  payrollDepartmentAccount: Security
  # Orion-End
  access: # EE parity, make corpsman able function.
  - Security
  - Brig
  - Medical
  - Maintenance
  - Service
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: SecurityStaff
  - !type:AddComponentSpecial
    components:
    - type: SurgerySpeedModifier
      speedModifier: 1.25 # Same as Paramedic
  # Arcane-start
  contracts:
  - DocumentContractEmploymentSecurity
  alternateTitles:
  - BrigmedicFieldMedic
  - BrigmedicPrisonDoctor
  # Arcane-end

- type: chameleonOutfit
  id: BrigmedicChameleonOutfit
  job: Brigmedic
  equipment:
    eyes: ClothingEyesGlassesMedSec
    mask: ClothingMaskBreathMedicalSecurity
    ears: ClothingHeadsetBrigmedic
    outerClothing: ClothingOuterCoatAMG
    gloves: ClothingHandsGlovesColorWhite
    jumpsuit: ClothingUniformJumpsuitBrigmedic
    id: BrigmedicPDA
    back: ClothingBackpackBrigmedic
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatBeretBrigmedic

# Arcane-Start
- type: jobAlternateTitle
  id: BrigmedicFieldMedic
  name: job-name-alt-brigmedic-1

- type: jobAlternateTitle
  id: BrigmedicPrisonDoctor
  name: job-name-alt-brigmedic-2
# Arcane-End
