- type: species
  id: Moth
  name: species-name-moth
  roundStart: true
  prototype: MobMoth
  sprites: MobMothSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobMothMarkingLimits
  dollPrototype: MobMothDummy
  skinColoration: Hues
  maleFirstNames: NamesMothFirstMale
  femaleFirstNames: NamesMothFirstFemale
  lastNames: NamesMothLast
  # Orion-Start
  category: Classic
  description: "/ServerInfo/_Orion/SpeciesDescriptions/Moth.xml"
  pros:
  - Получают на 20% меньше урона холодом.
  - Обладают ночным зрением.
  - Могут совершать протяжный прыжок благодаря крыльям.
  - Передвигаются гораздо лучше без гравитации, чем человек.
  special:
  - Имеют отличимый от других рас порог температуры. При низкой температуре получают 0.05 холода в секунду; При высокой температуре получают 3 ожогов в секунду.
  cons:
  - Получают на 30% больше урона огнём.
  - Получают на 10% больше колющего урона.
  - Легко возгораемые.
  # Orion-End
  # begin Goobstation: port EE height/width sliders
  minHeight: 0.8
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.80
  defaultWidth: 1
  maxWidth: 1.25
  # end Goobstation: port EE height/width sliders

