### Visitors with Visitor ID

# Command

- type: entity
  id: VisitorCommandBase
  abstract: true
  parent: MarkerBase
  categories: [ Spawner ]
  components:
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: ghost-role-information-command-name
      description: ghost-role-information-command-description
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: default
    - type: CloningAppearance
      components:
        - type: IdBind
        - type: AutoImplant
          implants:
          - MindShieldImplant
        - type: AntagImmune
        - type: RandomMetadata
          nameSegments:
          - NamesFirst
          - NamesLast
          nameFormat: name-format-standard

- type: entity
  id: RandomHumanoidVisitorCaptain
  name: visiting Captain ghost role
  parent: VisitorCommandBase
  components:
    - type: Sprite
      sprite: Markers/jobs.rsi
      state: captain
    - type: GhostRole
      name: job-name-captain
      description: ghost-role-information-command-description
    - type: CloningAppearance
      components:
        - type: Loadout
          prototypes: [ VisitorCaptain, VisitorCaptainAlt ]
          roleLoadout: [ RoleSurvivalStandard ]

