# Standard Combat Hardsuits
- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetHardsuitCombatStandard
  name: combat hardsuit helmet
  description: An armoured helmet with a yellow visor and dual head-mounted lights.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Head/Hardsuits/Combat/standard.rsi
  - type: Clothing
    sprite: _DV/Clothing/Head/Hardsuits/Combat/standard.rsi
  - type: PointLight
    color: "#ffeead"
  - type: PressureProtection
    highPressureMultiplier: 0.50
    lowPressureMultiplier: 1000
  - type: Armor
    # Arcane-Edit-Start: Removed
#    coverage:
#    - Chest
#    - Groin
#    - Arm
#    - Hand
#    - Leg
#    - Foot
    # Arcane-Edit-End
    modifiers:
      coefficients:
        # Arcane-Edit-Start
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.75
        # Arcane-Edit-End
        # Arcane-Start
        Radiation: 0.75
        Caustic: 0.75
        # Arcane-End

- type: entity
  parent: ClothingHeadHelmetHardsuitCombatStandard # Arcane-Edit
  id: ClothingHeadHelmetHardsuitCombatOfficer
  name: security combat hardsuit helmet
  components:
  - type: Sprite
    sprite: _DV/Clothing/Head/Hardsuits/Combat/officer.rsi
  - type: Clothing
    sprite: _DV/Clothing/Head/Hardsuits/Combat/officer.rsi

