# From https://github.com/DeltaV-Station/Delta-v/
name: PR Changelogs
concurrency: commit_action
on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ github.token }}
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR || 'Resources/Changelog/ArcaneChangelog.yml' }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    permissions:
      contents: write

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ vars.CHANGELOG_BRANCH || github.event.repository.default_branch }}

      - name: Setup Git
        shell: bash
        env:
          CHANGELOG_USER: ${{ vars.CHANGELOG_USER || 'arcane-changelog' }}
          CHANGELOG_EMAIL: ${{ vars.CHANGELOG_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "${CHANGELOG_USER}"
          git config user.email "${CHANGELOG_EMAIL}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        working-directory: Tools/changelog
        shell: bash
        run: npm install --ignore-scripts --no-package-lock

      - name: Generate Changelog
        working-directory: Tools/changelog
        shell: bash
        run: node changelog.js

      - name: Commit Changelog
        shell: bash
        env:
          CHANGELOG_BRANCH: ${{ vars.CHANGELOG_BRANCH || github.event.repository.default_branch }}
          CHANGELOG_MESSAGE: ${{ vars.CHANGELOG_MESSAGE || 'Automatic changelog update' }}
        run: |
          git add -- "${CHANGELOG_DIR}"

          if git diff --cached --quiet; then
            echo "Changelog не изменён."
            exit 0
          fi

          git commit -m "${CHANGELOG_MESSAGE} (#${PR_NUMBER})"
          git push origin "HEAD:${CHANGELOG_BRANCH}"
